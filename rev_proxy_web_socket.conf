server{
	listen 80;  #this listens port for http if you need custom you can edit
	server_name www.asbaitdev.cloud; #domain name of your application

	location /{			
		proxy_pass https://localhost:5000  #passes the request to mentioned server
		
		#these two lines share pass the client original ip to the webapplication_server
		proxy_set_header X-Real-IP $remote_addr;  
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		#hostname sends to the backend app
		proxy_set_header HOST	$host;
		
		#these three lines enabling Websocket
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";

		#note: websocket is http is oneway but websocket enabled the session can't closes to get a faster response.if dont use each time http request open session and close take a time.
	}
}
